<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Register</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<header>
    <div class="header-container">
        <h1>StudentHub</h1>

        <button
            id="menuButton"
            class="menu-button"
            type="button"
            aria-label="Toggle navigation menu"
        >
            ☰
        </button>

        <nav id="mainNavigation" aria-label="Main Navigation">
            <a href="../index.html">Home</a>
            <a href="about.html">About</a>
            <a href="register.html">Register</a>
            <a href="login.html">Login</a>
            <a href="dashboard.php">Student Dashboard</a>
            <a href="admin.php">Admin Dashboard</a>
            <a href="events.html">Events</a>
            <a href="contact.html">Contact</a>
            <a href="faq.html">FAQ</a>
            <a href="feedback.html">Feedback</a>

            <button id="themeButton" type="button">
                Dark Mode
            </button>
        </nav>
    </div>
</header>


<main>

    <section>

        <h2>Student Registration Form</h2>

        <form id="registrationForm" action="../php/register.php" method="POST">


            <!-- NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    autocomplete="name"
                    placeholder="Enter your full name"
                >

                <small
                    id="nameError"
                    class="error-message">
                </small>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                >

                <small
                    id="emailError"
                    class="error-message">
                </small>

            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="Enter 10 digit mobile number"
                >

                <small
                    id="mobileError"
                    class="error-message">
                </small>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    placeholder="Enter password"
                >

                <small
                    id="passwordError"
                    class="error-message">
                </small>

                <div class="password-meter">

                    <div
                        id="passwordStrengthBar"
                        class="password-strength-bar">
                    </div>

                </div>

                <p id="passwordStrengthText">
                    Password Strength
                </p>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    autocomplete="new-password"
                    placeholder="Re-enter password"
                >

                <small
                    id="confirmPasswordError"
                    class="error-message">
                </small>

            </div>


            <!-- COURSE -->

            <div class="form-group">

                <label for="course">
                    Course
                </label>

                <select
                    id="course"
                    name="course">

                    <option value="">
                        Select Course
                    </option>

                    <option value="AIML">
                        AIML
                    </option>

                    <option value="CE">
                        Computer Engineering
                    </option>

                    <option value="IT">
                        Information Technology
                    </option>

                </select>

                <small
                    id="courseError"
                    class="error-message">
                </small>

            </div>


            <!-- YEAR -->

            <div class="form-group">

                <label for="year">
                    Year
                </label>

                <select
                    id="year"
                    name="year">

                    <option value="">
                        Select Year
                    </option>

                    <option value="1">
                        First Year
                    </option>

                    <option value="2">
                        Second Year
                    </option>

                    <option value="3">
                        Third Year
                    </option>

                    <option value="4">
                        Fourth Year
                    </option>

                </select>

                <small
                    id="yearError"
                    class="error-message">
                </small>

            </div>


            <!-- GENDER -->

            <fieldset class="form-group">

                <legend>
                    Gender
                </legend>

                <div class="radio-group">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male">
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female">
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other">
                        Other
                    </label>

                </div>

                <small
                    id="genderError"
                    class="error-message">
                </small>

            </fieldset>


            <!-- TERMS -->

            <div class="form-group">

                <label class="checkbox-label">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        value="accepted">

                    I accept the Terms and Conditions

                </label>

                <small
                    id="termsError"
                    class="error-message">
                </small>

            </div>


            <!-- BUTTON -->

            <button type="submit">
                Register
            </button>


            <!-- SUCCESS MESSAGE -->

            <p
                id="successMessage"
                class="success-message">
            </p>


        </form>

    </section>

</main>


<footer>

    <p>
        StudentHub &copy; 2026
    </p>

</footer>

<script src="../js/script.js"></script>

</body>

</html>
