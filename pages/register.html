<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Register</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

    <h1>StudentHub</h1>

    <nav aria-label="Main Navigation">

        <a href="../index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="events.html">Events</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>

    </nav>

</header>


<main>

    <section>

        <h2>Create Student Account</h2>

        <form>

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="studentId">
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="course">
                    Course
                </label>

                <select id="course" name="course">

                    <option value="">
                        Select Course
                    </option>

                    <option value="aiml">
                        AIML
                    </option>

                    <option value="ce">
                        Computer Engineering
                    </option>

                    <option value="it">
                        Information Technology
                    </option>

                </select>

            </div>


            <button type="submit">
                Register
            </button>

        </form>

    </section>

</main>


<footer>

    <p>StudentHub &copy; 2026</p>

</footer>

</body>

</html>
